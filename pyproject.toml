[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-nalyzer"
version = "0.1.0"
description = "Intelligent, Genre-Aware Local DJ Music Intelligence & Cue Extraction System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "numba>=0.58.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "mutagen>=1.47.0",
    "rich>=13.0.0",
]

[project.scripts]
cue-nalyzer = "cue_nalyzer.cli.main:main"

